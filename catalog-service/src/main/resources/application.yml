server:
  port: 8083

spring:
  application:
    name: catalog-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalog}
    username: ${DB_USERNAME:aura}
    password: ${DB_PASSWORD:aura}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # NOTE: this currently fails at startup - the Product entity maps a `price` column that the
      # V1 migration does not create (price belongs on product_variants). Catalog's schema and
      # entities are rebuilt together in Phase 3; leaving validation on so the mismatch cannot be
      # forgotten.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    stream:
      bindings:
        productChangedOut-out-0:
          destination: ${aura.kafka.topics.product-changed:aura.catalog.product-changed.v1}
          producer:
            # Events for one product must land on one partition, or a redelivered older document
            # can be indexed after a newer one. The header is set per message by the publisher.
            partition-key-expression: headers['partitionKey']

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

aura:
  catalog:
    internal:
      # Shared secret for /api/internal/**, which order-service uses to hold and settle stock.
      # No default: an unset key makes every internal call fail closed rather than pass.
      api-key: ${AURA_INTERNAL_API_KEY:}
    inventory:
      # How often abandoned stock holds are swept up. Short, because the stock is unsellable until
      # it happens.
      expiry-sweep-interval: ${AURA_STOCK_SWEEP_INTERVAL:PT30S}
    media:
      # Direct, not via the gateway: the gateway authenticates traffic arriving from outside, and
      # routing an internal call through it adds a hop and a second thing that can be down.
      base-url: ${AURA_MEDIA_BASE_URL:http://localhost:8084}
  security:
    jwt:
      jwk-set-uri: ${AURA_JWKS_URI:http://localhost:8081/api/auth/.well-known/jwks.json}
      issuer: ${AURA_TOKEN_ISSUER:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aura: DEBUG
