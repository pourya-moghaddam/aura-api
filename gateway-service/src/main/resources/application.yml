server:
  port: 8080

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    gateway:
      # NOTE: the `server.webflux` segment is required as of Spring Cloud Gateway 5.x.
      # The older `spring.cloud.gateway.routes` path is not an error - it is silently ignored,
      # which presents as "the gateway 404s everything" with nothing in the logs.
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/api/auth/**
              filters:
                # Tightest bucket in the system: these endpoints send SMS, and each one costs
                # money. Unmetered, a loop here drains the SMS balance.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 3
                    redis-rate-limiter.burstCapacity: 6
                    redis-rate-limiter.requestedTokens: 1

            - id: catalog-service
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/catalog/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 30
                    redis-rate-limiter.burstCapacity: 60

            - id: search-service
              uri: lb://SEARCH-SERVICE
              predicates:
                - Path=/api/search/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    # Higher than the catalogue's: a shopper types, and every keystroke can be a
                    # request. Throttling as-you-type search to browsing speed makes the box feel
                    # broken rather than protected.
                    redis-rate-limiter.replenishRate: 60
                    redis-rate-limiter.burstCapacity: 120

            - id: catalog-service-control
              uri: lb://CATALOG-SERVICE
              predicates:
                - Path=/api/control/catalog/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40

            - id: order-service
              uri: lb://ORDER-SERVICE
              predicates:
                # Anonymous by design: requirement 12 makes guests first-class buyers, so cart and
                # checkout carry no audience requirement. What protects a guest's cart is the
                # unguessable token in their cookie, not a token.
                - Path=/api/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@ipKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40

            - id: order-service-control
              uri: lb://ORDER-SERVICE
              predicates:
                - Path=/api/control/orders/**
              filters:
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 20
                    redis-rate-limiter.burstCapacity: 40

            - id: media-service
              uri: lb://MEDIA-SERVICE
              predicates:
                - Path=/api/media/**
              filters:
                # Tighter than catalog reads: every call here either mints a credential to write
                # into storage or one to read from it, and both cost more than a page of products.
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 10
                    redis-rate-limiter.burstCapacity: 20

          # No route to notification-service on purpose: it is event-driven and has no public API.
          # Adding a route would expose an SMS-sending service to the internet.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

aura:
  security:
    jwt:
      jwk-set-uri: ${AURA_JWKS_URI:http://localhost:8081/api/auth/.well-known/jwks.json}
      issuer: ${AURA_TOKEN_ISSUER:http://localhost:8081}

management:
  # Actuator moves off the application port onto its own, and that port is never published.
  # Metrics carry business shape - order counts, queue depth, error rates - and "/actuator is not
  # reachable from outside" becomes structural rather than a rule someone has to keep enforcing in
  # every service's security config. It also means the gateway cannot route to it by accident.
  server:
    port: 9091
  metrics:
    distribution:
      # Without this Micrometer publishes only a count and a sum for request timings, so any
      # percentile query returns nothing at all - the dashboard panel renders empty and reads as
      # "no traffic" rather than "no data". A mean hides the case that matters: it stays flat while
      # one shopper in twenty waits eight seconds for checkout.
      percentiles-histogram:
        http.server.requests: true
      # Bounded on purpose. An unbounded histogram is one series per bucket per endpoint per
      # status, which is how a metrics endpoint quietly becomes the slowest thing in the service.
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 10s
  endpoints:
    web:
      exposure:
        include: health,info,gateway,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aura: DEBUG
