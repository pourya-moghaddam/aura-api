server:
  port: 8081

spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth}
    username: ${DB_USERNAME:aura}
    password: ${DB_PASSWORD:aura}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cloud:
    stream:
      bindings:
        otpRequestedOut-out-0:
          destination: ${aura.kafka.topics.otp-requested}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

logging:
  level:
    root: INFO
    com.aura: DEBUG

management:
  # Actuator moves off the application port onto its own, and that port is never published.
  # Metrics carry business shape - order counts, queue depth, error rates - and "/actuator is not
  # reachable from outside" becomes structural rather than a rule someone has to keep enforcing in
  # every service's security config. It also means the gateway cannot route to it by accident.
  server:
    port: 9091
  metrics:
    distribution:
      # Without this Micrometer publishes only a count and a sum for request timings, so any
      # percentile query returns nothing at all - the dashboard panel renders empty and reads as
      # "no traffic" rather than "no data". A mean hides the case that matters: it stays flat while
      # one shopper in twenty waits eight seconds for checkout.
      percentiles-histogram:
        http.server.requests: true
      # Bounded on purpose. An unbounded histogram is one series per bucket per endpoint per
      # status, which is how a metrics endpoint quietly becomes the slowest thing in the service.
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 10s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

aura:
  auth:
    otp:
      ttl: 3m
      length: 6
      # Wrong guesses before the code is burned.
      max-attempts: 5
      resend-cooldown: 60s
      max-per-phone-per-hour: 5
      max-per-ip-per-hour: 20
      # Daily circuit breaker on total sends - the cap on how large the SMS bill can get if every
      # other limit is evaded by a distributed source.
      max-per-day-global: 2000
      # HMAC key for hashing codes at rest. Startup fails under the prod profile if unset.
      pepper: ${AURA_AUTH_OTP_PEPPER:}
      otp-binding-name: "otpRequestedOut-out-0"
    token:
      issuer: ${AURA_TOKEN_ISSUER:http://localhost:8081}
      access-token-ttl: 15m
      refresh-token-ttl: 30d
      # False by default so local HTTP does not silently drop the cookie. Must be true in prod -
      # set AURA_TOKEN_COOKIE_SECURE=true there.
      cookie-secure: ${AURA_TOKEN_COOKIE_SECURE:false}
      rsa:
        # Supplied via AURA_AUTH_TOKEN_RSA_PRIVATE_KEY_PEM / _PUBLIC_KEY_PEM.
        # Left empty for local development, where an ephemeral keypair is generated at startup.
        # Startup fails under the prod profile if these are unset - see JwkConfig.
        private-key-pem: ${AURA_AUTH_TOKEN_RSA_PRIVATE_KEY_PEM:}
        public-key-pem: ${AURA_AUTH_TOKEN_RSA_PUBLIC_KEY_PEM:}
        key-id: ${AURA_AUTH_TOKEN_RSA_KEY_ID:aura-signing-key}
    super-admin:
      # Created once on first startup if no SUPER_ADMIN exists yet. Left empty in dev - the
      # bootstrap runner just warns and skips rather than creating an account with a known
      # password. Startup fails under the prod profile if these are unset - see
      # SuperAdminBootstrapRunner.
      phone: ${AURA_SUPERADMIN_PHONE:}
      password: ${AURA_SUPERADMIN_PASSWORD:}
  kafka:
    topics:
      otp-requested: ${KAFKA_TOPIC_OTP_REQUESTED:aura.auth.otp-requested.v1}
