# Development stack. Bring it up with:
#
#   cp .env.example .env && docker compose up -d --build
#
# Production overrides live in compose.prod.yaml:
#
#   docker compose -f compose.yaml -f compose.prod.yaml up -d

name: aura

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [aura]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: ${POSTGRES_USER:-aura}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-aura}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  EUREKA_URL: http://discovery-service:8761/eureka/
  AURA_JWKS_URI: http://auth-service:8081/api/auth/.well-known/jwks.json
  AURA_TOKEN_ISSUER: ${AURA_TOKEN_ISSUER:-http://auth-service:8081}

services:
  # -------------------------------------------------------------------------------------------
  # Infrastructure
  # -------------------------------------------------------------------------------------------
  postgres:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aura}
      POSTGRES_DB: ${POSTGRES_DB:-aura}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aura}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    <<: *service-defaults
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    <<: *service-defaults
    image: confluentinc/cp-kafka:7.6.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners on purpose. The previous single-listener setup advertised localhost:9092,
      # which resolves to the *container itself* for every other container - so no service could
      # ever reach the broker. PLAINTEXT is for container-to-container, PLAINTEXT_HOST is for
      # tooling running on the developer's machine.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  elasticsearch:
    <<: *service-defaults
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      discovery.type: single-node
      # Dev only. Production runs with security on and a real certificate.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1512M

  minio:
    <<: *service-defaults
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aura}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aura-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # -------------------------------------------------------------------------------------------
  # Application services
  # -------------------------------------------------------------------------------------------
  discovery-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: discovery-service
    image: aura/discovery-service:${TAG:-dev}
    environment:
      EUREKA_HOSTNAME: discovery-service
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9091/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  auth-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: auth-service
    image: aura/auth-service:${TAG:-dev}
    environment:
      <<: *app-env
      DB_NAME: auth
      AURA_AUTH_TOKEN_RSA_PRIVATE_KEY_PEM: ${AURA_AUTH_TOKEN_RSA_PRIVATE_KEY_PEM:-}
      AURA_AUTH_TOKEN_RSA_PUBLIC_KEY_PEM: ${AURA_AUTH_TOKEN_RSA_PUBLIC_KEY_PEM:-}
      AURA_SUPERADMIN_PHONE: ${AURA_SUPERADMIN_PHONE:-}
      AURA_SUPERADMIN_PASSWORD: ${AURA_SUPERADMIN_PASSWORD:-}
    ports:
      - "8081:8081"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      discovery-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  catalog-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: catalog-service
    image: aura/catalog-service:${TAG:-dev}
    environment:
      <<: *app-env
      DB_NAME: catalog
      AURA_MEDIA_BASE_URL: http://media-service:8084
      AURA_INTERNAL_API_KEY: ${AURA_INTERNAL_API_KEY:?set AURA_INTERNAL_API_KEY in .env}
    ports:
      - "8083:8083"
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      discovery-service: {condition: service_healthy}
      # Attaching media to a product asks media-service whether the file is servable and whose it
      # is, so publishing depends on it being up. Deliberately fails closed.
      media-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  order-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: order-service
    image: aura/order-service:${TAG:-dev}
    environment:
      <<: *app-env
      DB_NAME: orders
      AURA_CATALOG_BASE_URL: http://catalog-service:8083
      AURA_INTERNAL_API_KEY: ${AURA_INTERNAL_API_KEY:?set AURA_INTERNAL_API_KEY in .env}
    ports:
      - "8082:8082"
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      discovery-service: {condition: service_healthy}
      # Checkout holds stock through catalog's internal API, so it cannot complete without it.
      catalog-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  media-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: media-service
    image: aura/media-service:${TAG:-dev}
    environment:
      <<: *app-env
      DB_NAME: media
      # Internal: how this container talks to MinIO.
      MINIO_ENDPOINT: http://minio:9000
      # Public: what goes into presigned URLs. "minio" does not resolve in a browser, so signing
      # with the internal name yields URLs that fail DNS on the client with nothing explaining why.
      # In production this becomes the public storage or CDN hostname.
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aura}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aura-dev-secret}
      # No-op scanner in development; see application.yml for why.
      MEDIA_SCAN_PROVIDER: ${MEDIA_SCAN_PROVIDER:-none}
    ports:
      - "8084:8084"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      discovery-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  search-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: search-service
    image: aura/search-service:${TAG:-dev}
    environment:
      <<: *app-env
      ELASTICSEARCH_URI: http://elasticsearch:9200
      # Creates products_v1 behind the alias on a cold cluster. Something to reconsider in
      # production, where index creation is usually a deliberate act rather than a deploy side
      # effect.
      AURA_SEARCH_INDEX_BOOTSTRAP: ${AURA_SEARCH_INDEX_BOOTSTRAP:-true}
    ports:
      - "8085:8085"
    depends_on:
      elasticsearch: {condition: service_healthy}
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
      discovery-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  notification-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: notification-service
    image: aura/notification-service:${TAG:-dev}
    environment:
      <<: *app-env
      DB_NAME: notification
      AURA_SMS_MODE: ${AURA_SMS_MODE:-mock}
      SMS_IR_API_KEY: ${SMS_IR_API_KEY:-}
      SMS_IR_OTP_TEMPLATE_ID: ${SMS_IR_OTP_TEMPLATE_ID:-}
      SMS_IR_LINE_NUMBER: ${SMS_IR_LINE_NUMBER:-}
    # Intentionally not published: event-driven, no public API, and it spends money when called.
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      discovery-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  gateway-service:
    <<: *service-defaults
    build:
      context: .
      args:
        SERVICE: gateway-service
    image: aura/gateway-service:${TAG:-dev}
    environment:
      <<: *app-env
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis: {condition: service_healthy}
      discovery-service: {condition: service_healthy}
      auth-service: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ---------------------------------------------------------------------------------------------
  # Observability
  #
  # Both scrape and read over the Docker network only. Their own ports are published so a developer
  # can open them, but nothing they talk to is: every service's actuator lives on 9091, which no
  # service publishes.
  # ---------------------------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    networks: [aura]
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Long enough to see a week-on-week pattern, short enough that a laptop survives it.
      - --storage.tsdb.retention.time=15d
    ports: ["9090:9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    networks: [aura]
    environment:
      # Anonymous view access, because this stack is a laptop and a login prompt in front of a
      # dashboard nobody can change is friction without a benefit. compose.prod.yaml sets a real
      # admin password and turns this off.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports: ["3000:3000"]
    depends_on:
      prometheus: {condition: service_healthy}

networks:
  aura:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  elasticsearch_data:
  minio_data:
  prometheus_data:
  grafana_data:
