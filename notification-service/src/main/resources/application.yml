server:
  port: 8082

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notification}
    username: ${DB_USERNAME:aura}
    password: ${DB_PASSWORD:aura}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # See RestClientConfig: an SMS provider that accepts the connection and then stops talking would
  # otherwise hold a consumer thread forever and stall the queue behind it.
  http:
    client:
      connect-timeout: 5s
      read-timeout: 10s

  cloud:
    function:
      definition: otpRequestedIn;orderItemStatusChanged
    stream:
      bindings:
        orderItemStatusChanged-in-0:
          destination: ${aura.kafka.topics.order-item-status-changed:aura.order.item-status-changed.v1}
          # Its own group, so a poisoned status message cannot stall login codes behind it. An OTP
          # is the one message where a delay is the same as a failure.
          group: notification-order-status
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
        otpRequestedIn-in-0:
          destination: ${aura.kafka.topics.otp-requested}
          group: notification-group
          consumer:
            max-attempts: 3
            back-off-initial-interval: 1000
      kafka:
        binder:
          brokers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
        bindings:
          otpRequestedIn-in-0:
            consumer:
              # Messages that fail every retry go to <topic>.DLT rather than blocking the
              # partition. Nothing else can make progress behind a poison message otherwise.
              enable-dlq: true
              dlq-name: aura.auth.otp-requested.v1.DLT
          orderItemStatusChanged-in-0:
            consumer:
              enable-dlq: true
              dlq-name: aura.order.item-status-changed.v1.DLT

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  # Actuator moves off the application port onto its own, and that port is never published.
  # Metrics carry business shape - order counts, queue depth, error rates - and "/actuator is not
  # reachable from outside" becomes structural rather than a rule someone has to keep enforcing in
  # every service's security config. It also means the gateway cannot route to it by accident.
  server:
    port: 9091
  metrics:
    distribution:
      # Without this Micrometer publishes only a count and a sum for request timings, so any
      # percentile query returns nothing at all - the dashboard panel renders empty and reads as
      # "no traffic" rather than "no data". A mean hides the case that matters: it stays flat while
      # one shopper in twenty waits eight seconds for checkout.
      percentiles-histogram:
        http.server.requests: true
      # Bounded on purpose. An unbounded histogram is one series per bucket per endpoint per
      # status, which is how a metrics endpoint quietly becomes the slowest thing in the service.
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 10s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

aura:
  notification:
    sms:
      # mock accepts everything and sends nothing. Deliberately the default: a fresh checkout must
      # not be able to spend money or text a real number. Set to http with a key for production.
      mode: ${AURA_SMS_MODE:mock}
      sms-ir:
        # Supplied via SMS_IR_API_KEY. Never commit a live key - the previous value in this file
        # was a working credential and should be rotated at the provider.
        api-key: ${SMS_IR_API_KEY:}
        otp-template-id: ${SMS_IR_OTP_TEMPLATE_ID:823095}
        base-url: ${SMS_IR_BASE_URL:https://api.sms.ir/v1}
        verify-path: "/send/verify"
        bulk-path: "/send/bulk"
        line-number: ${SMS_IR_LINE_NUMBER:}
        otp-parameter-name: "OTP"
  kafka:
    topics:
      # Must match auth-service's producer binding; see com.aura.common.events.Topics.
      otp-requested: ${KAFKA_TOPIC_OTP_REQUESTED:aura.auth.otp-requested.v1}
      order-item-status-changed: ${KAFKA_TOPIC_ORDER_ITEM_STATUS_CHANGED:aura.order.item-status-changed.v1}

logging:
  level:
    root: INFO
    com.aura: DEBUG
