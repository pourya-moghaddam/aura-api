server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USERNAME:aura}
    password: ${DB_PASSWORD:aura}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that the entities agree with it. A CHAR(n)
      # column against a varchar mapping has crash-looped two services in this project already,
      # and validation is what turns that into a startup failure rather than a runtime surprise.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  cloud:
    stream:
      bindings:
        orderItemStatusChangedOut-out-0:
          destination: ${aura.kafka.topics.order-item-status-changed:aura.order.item-status-changed.v1}
          producer:
            # Keyed by order, so a buyer's notifications about one order stay in the sequence they
            # happened rather than arriving out of order across partitions.
            partition-key-expression: headers['partitionKey']
        orderPaidOut-out-0:
          destination: ${aura.kafka.topics.order-paid:aura.order.paid.v1}
          producer:
            partition-key-expression: headers['partitionKey']

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

aura:
  order:
    catalog:
      # Direct, not through the gateway: checkout holds stock inside its own transaction, and
      # routing that internally through the edge adds a hop and a second thing that can be down.
      base-url: ${AURA_CATALOG_BASE_URL:http://localhost:8083}
      # Shared secret for catalog's /api/internal/** stock endpoints. Guest checkout means there
      # may be no user token at all, so this is what authenticates the service rather than a
      # borrowed identity.
      internal-api-key: ${AURA_INTERNAL_API_KEY:}
    cart:
      # How long an abandoned guest cart is kept before the sweep removes it. Generous, because a
      # cart is business data and someone coming back a fortnight later is ordinary.
      guest-retention: ${AURA_GUEST_CART_RETENTION:P30D}
      cookie-secure: ${AURA_COOKIE_SECURE:false}
    link:
      # How long a seller's order link works for. Short, because the stock behind it is held from
      # the moment the order is written.
      validity: ${AURA_ORDER_LINK_VALIDITY:PT48H}
      base-url: ${AURA_STOREFRONT_PAY_LINK_URL:http://localhost:3000/pay}
    payment-reconciliation:
      # How long a payment may sit pending before Zarinpal is asked about it directly. Lost
      # callbacks are ordinary - a closed browser, a dropped connection on the way back - and each
      # one is a customer who paid while the shop believes they did not.
      older-than: ${AURA_PAYMENT_RECONCILE_AFTER:PT10M}
      batch-size: ${AURA_PAYMENT_RECONCILE_BATCH:50}

  payment:
    zarinpal:
      # mock settles locally so the whole flow can be exercised without a merchant account.
      # MUST be http in production, where mock would mark every order paid for nothing.
      mode: ${AURA_ZARINPAL_MODE:mock}
      merchant-id: ${AURA_ZARINPAL_MERCHANT_ID:}
      # sandbox.zarinpal.com for testing (authorities begin with S), payment.zarinpal.com live.
      base-url: ${AURA_ZARINPAL_BASE_URL:https://sandbox.zarinpal.com}
      # Must be reachable from the shopper's browser, so it is the public gateway address rather
      # than this service's own.
      callback-url: ${AURA_ZARINPAL_CALLBACK_URL:http://localhost:8080/api/orders/payments/callback}
      result-url: ${AURA_STOREFRONT_PAYMENT_RESULT_URL:http://localhost:3000/checkout/result}

  security:
    jwt:
      jwk-set-uri: ${AURA_JWKS_URI:http://localhost:8081/api/auth/.well-known/jwks.json}
      issuer: ${AURA_TOKEN_ISSUER:http://localhost:8081}

management:
  # Actuator moves off the application port onto its own, and that port is never published.
  # Metrics carry business shape - order counts, queue depth, error rates - and "/actuator is not
  # reachable from outside" becomes structural rather than a rule someone has to keep enforcing in
  # every service's security config. It also means the gateway cannot route to it by accident.
  server:
    port: 9091
  metrics:
    distribution:
      # Without this Micrometer publishes only a count and a sum for request timings, so any
      # percentile query returns nothing at all - the dashboard panel renders empty and reads as
      # "no traffic" rather than "no data". A mean hides the case that matters: it stays flat while
      # one shopper in twenty waits eight seconds for checkout.
      percentiles-histogram:
        http.server.requests: true
      # Bounded on purpose. An unbounded histogram is one series per bucket per endpoint per
      # status, which is how a metrics endpoint quietly becomes the slowest thing in the service.
      minimum-expected-value:
        http.server.requests: 10ms
      maximum-expected-value:
        http.server.requests: 10s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aura: DEBUG
