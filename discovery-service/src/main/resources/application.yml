server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  instance:
    # Overridden to the service name in Compose; `localhost` only works when everything shares a host.
    hostname: ${EUREKA_HOSTNAME:localhost}
  client:
    # This is the registry itself, so it neither registers with nor fetches from anyone.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.aura: DEBUG
